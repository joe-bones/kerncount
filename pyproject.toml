[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kerncount"
version = "0.2.0"
description = "Automated nucleus counting, intensity measurement and multi-n analysis for fluorescence images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "tifffile",
    "pandas>=2",
    "matplotlib",
    "openpyxl",
    "statsmodels>=0.14",
    "pillow",
    "stardist>=0.9",
    "csbdeep>=0.7",  # imported directly (csbdeep.utils.normalize); also a dependency of stardist
    "tensorflow>=2.13",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
kerncount = "kerncount.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kerncount = ["models/**/*", "web/*"]

[tool.pytest.ini_options]
# heavy simulations (type I error loops) and large generation builds are marked slow and skipped by default;
# run them with `pytest -m slow` (or everything with `pytest -m "slow or not slow"`)
markers = ["slow: heavy simulations and large model fits / generation builds (run with -m slow)"]
addopts = "-m 'not slow'"
