[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kerncount"
version = "0.1.0"
description = "Automated nucleus counting, intensity measurement and multi-n analysis for fluorescence images"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "tifffile",
    "pandas>=2",
    "matplotlib",
    "openpyxl",
    "pillow",
    "stardist>=0.9",
    "tensorflow>=2.13",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
kerncount = "kerncount.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kerncount = ["models/**/*"]
