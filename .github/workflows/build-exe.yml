name: Build kerncount launchers
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: macos-latest   # for codesign/ditto on the Mac app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: sh launcher/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: kerncount-launchers
          path: |
            dist/kerncount.exe
            dist/kerncount-mac.zip
