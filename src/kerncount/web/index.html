<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="kerncount-token" content="__TOKEN__">
<title>kerncount</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <div class="brand">kerncount</div>
  <div class="ws" id="wsLabel" title="Workspace folder"></div>
  <div class="spacer"></div>
  <button class="ghost" id="btnWorkspace">Workspace</button>
  <button class="ghost" id="btnQuit">Quit</button>
</header>
<div id="app">
  <nav id="side">
    <div class="side-title">Experiments</div>
    <div id="expList"></div>
    <div class="side-new">
      <input id="newExp" placeholder="new experiment name">
      <button id="btnNewExp">+ Add</button>
    </div>
  </nav>
  <main id="main"></main>
</div>
<div id="toast"></div>
<section id="logDock" class="collapsed">
  <div class="log-head" id="logHead">
    <span id="jobLabel">Log</span>
    <span class="spacer"></span>
    <button id="stopBtn" class="danger small" disabled>Stop</button>
    <span class="chev" id="logChev">▲</span>
  </div>
  <pre id="log"></pre>
</section>
<div id="modal" class="hidden"><div class="modal-box" id="modalBox"></div></div>
<!-- no inline script: the page runs under Content-Security-Policy script-src 'self' (token: meta tag above) -->
<script src="/static/app.js"></script>
<script src="/static/results.js"></script>
<script src="/static/intensity.js"></script>
<script src="/static/plan.js"></script>
</body>
</html>
